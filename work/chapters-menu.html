<style>
.folioNav .folioWidth{overflow:visible;display:flex;justify-content:space-between;gap:16px;align-items:center;min-height:56px}.atlas-chapters{position:relative;width:min(620px,100%);min-width:0}.atlas-chapters>summary{display:flex;align-items:center;justify-content:space-between;gap:15px;list-style:none;cursor:pointer;padding:15px 0;color:#f5dfb8;font:600 14px var(--sans)}.atlas-chapters>summary::-webkit-details-marker{display:none}.atlas-chapters>summary:after{content:'⌄';font-size:22px;line-height:1}.atlas-chapters[open]>summary:after{content:'⌃'}.chapters-title{display:flex;align-items:center;gap:14px}.chapters-title svg{width:20px;height:20px;flex:none}.chapters-current{color:#cbb18a;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}.chapter-menu{position:absolute;top:100%;left:0;width:min(620px,calc(100vw - 36px));max-height:min(70vh,620px);overflow-y:auto;background:#2d2118;border:1px solid #b18b50;box-shadow:0 18px 35px #140b0860;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:5px;z-index:30}.folioNav .chapter-menu a{white-space:normal;display:flex;align-items:center;padding:12px 14px;border:1px solid #c79e5730;font-size:13px;min-height:45px}.folioNav .chapter-menu a:hover,.folioNav .chapter-menu a[aria-current]{background:#664a28;color:#ffe6b5;border-color:#ac864f}.chapter-menu a:before{counter-increment:chapter;content:counter(chapter,decimal-leading-zero);font:18px var(--serif);color:#b89560;margin-right:12px}.chapter-menu{counter-reset:chapter}.nav-wordmark{font:18px var(--serif);color:#d5b989}.atlas-chapters:not([open]) .chapter-menu{display:none}
@media(max-width:700px){.chapters-current{max-width:140px;font-size:10px}.nav-wordmark{display:none}.atlas-chapters{width:100%}.chapter-menu{grid-template-columns:1fr 1fr;gap:4px;padding:8px}.folioNav .chapter-menu a{font-size:11px;padding:10px 8px}.chapter-menu a:before{margin-right:7px;font-size:15px}.chapters-title{gap:8px}.atlas-chapters>summary{font-size:12px}}
</style>
<script>(()=>{const nav=document.querySelector('.folioNav'),box=nav.querySelector('.folioWidth'),links=[...box.querySelectorAll('a')];const details=document.createElement('details');details.className='atlas-chapters';details.id='chapter-picker';const summary=document.createElement('summary');summary.innerHTML='<span class="chapters-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M3 12h18M3 19h18" stroke="currentColor" stroke-width="1.5"/></svg>Главы атласа</span><span class="chapters-current">Выберите раздел</span>';const menu=document.createElement('div');menu.className='chapter-menu';links.forEach(a=>menu.append(a));details.append(summary,menu);box.replaceChildren(details);const brand=document.createElement('span');brand.className='nav-wordmark';brand.textContent='Маршалкины · семейная летопись';box.append(brand);menu.addEventListener('click',e=>{if(e.target.closest('a'))details.open=false});document.addEventListener('click',e=>{if(!details.contains(e.target))details.open=false});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&details.open){details.open=false;summary.focus()}});const label=summary.querySelector('.chapters-current');new MutationObserver(()=>{const current=menu.querySelector('a[aria-current]');if(current)label.textContent=current.textContent}).observe(menu,{attributes:true,attributeFilter:['aria-current'],subtree:true});})();</script>
