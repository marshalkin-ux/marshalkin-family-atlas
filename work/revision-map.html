<figure class="frontier-map"><svg viewBox="0 0 980 610" role="img" aria-labelledby="frontier-map-title frontier-map-desc"><title id="frontier-map-title">Обоянь на южном пограничье Русского царства</title><desc id="frontier-map-desc">Географическая схема европейской части России с Обоянью, Курском, Москвой и приблизительным направлением Белгородской оборонительной черты XVII века. Линия укреплений не является точной государственной границей.</desc><defs><pattern id="map-grid" width="90" height="70" patternUnits="userSpaceOnUse"><path d="M90 0H0V70" fill="none" stroke="#8b7554" stroke-opacity=".12"/></pattern><linearGradient id="steppe" x2="0" y2="1"><stop stop-color="#eadab4"/><stop offset="1" stop-color="#c8ae77"/></linearGradient></defs><rect x="1" y="1" width="978" height="608" rx="8" fill="#efe5d0" stroke="#b59460"/><rect x="1" y="1" width="978" height="608" fill="url(#map-grid)"/><path d="M80 417L233 410 325 425 393 380 483 397 535 348 596 284 650 271 717 284 784 290 898 238V609H80z" fill="url(#steppe)" opacity=".65"/><path d="M110 90Q250 140 220 230T260 400Q300 480 244 560M540 70Q488 134 510 220T562 353Q604 445 650 548" fill="none" stroke="#9baead" stroke-width="4" opacity=".7"/><text x="195" y="470" fill="#728787" font-size="15" transform="rotate(65 195 470)">Днепр</text><text x="598" y="455" fill="#728787" font-size="15" transform="rotate(63 598 455)">Дон</text><text x="66" y="58" font-size="15" letter-spacing="3" fill="#8c663b">РУССКОЕ ЦАРСТВО · СЕРЕДИНА XVII ВЕКА</text><text x="630" y="520" font-size="27" fill="#987647">Степное пограничье</text><text x="620" y="548" font-size="14" fill="#806340">направление к Крымскому ханству ↓</text><g fill="#4a3623" font-family="Georgia,serif"><circle cx="430" cy="119" r="5"/><text x="443" y="125" font-size="22">Москва</text><circle cx="316" cy="330" r="4"/><text x="259" y="321" font-size="20">Курск</text><circle cx="349" cy="425" r="5"/><text x="362" y="447" font-size="19">Белгород</text><circle cx="557" cy="336" r="4"/><text x="569" y="330" font-size="19">Воронеж</text><circle cx="661" cy="233" r="4"/><text x="617" y="213" font-size="17">Козлов</text><circle cx="738" cy="248" r="4"/><text x="753" y="251" font-size="17">Тамбов</text></g><path d="M236 419L293 407 349 425 410 396 465 410 510 377 557 336 608 289 661 233 738 248" fill="none" stroke="#a05b3d" stroke-width="5" stroke-linejoin="round" stroke-dasharray="11 7"/><g transform="translate(323 372)"><circle r="25" fill="#a45232" opacity=".15"/><circle r="13" fill="#a45232" opacity=".24"/><circle r="6" fill="#a45232" stroke="#fff4db" stroke-width="2"/><path d="M0 0L-72-55H-176" fill="none" stroke="#a45232" stroke-width="1.5"/><rect x="-230" y="-113" width="180" height="48" rx="3" fill="#493524"/><text x="-212" y="-82" font-family="Georgia,serif" font-size="28" fill="#f4e6ca">Обоянь</text><text x="-224" y="-38" font-size="14" fill="#6a4a2e">Крепость заложена в 1649</text></g><g transform="translate(66 565)"><path d="M0 0h53" stroke="#a05b3d" stroke-width="4" stroke-dasharray="10 6"/><text x="65" y="5" font-size="15" fill="#62452c">Белгородская черта — приблизительное направление укреплений</text></g></svg><figcaption>Обоянь находилась в южной пограничной зоне Русского царства, севернее Белгородской оборонительной черты. Схема показывает положение городов и направление укреплений середины XVII века; оборонительная линия не совпадала с точной государственной границей. <a href="https://old.bigenc.ru/domestic_history/text/2283695" target="_blank" rel="noopener">БРЭ · Обоянь</a> · <a href="https://historyrussia.org/index.php?catid=86&amp;id=4182&amp;option=com_content&amp;view=article" target="_blank" rel="noopener">Российское историческое общество · Белгородская черта</a>.</figcaption></figure><style>.frontier-map{margin:24px 0}.frontier-map svg{width:100%;height:auto;display:block}.frontier-map figcaption{font-size:13px;line-height:1.6;color:#705b41;margin-top:12px}</style>
